name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go test suite
        run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built once here, not on the server -- the server only ever pulls
      # this tag. ~/Sites/server-config is bootstrapping-only (Docker/
      # nginx/certbot install, the deploy account, shared nginx snippets);
      # this app's own deploy/deploy.sh owns everything specific to it
      # (compose file, container lifecycle, its nginx vhost, its own
      # certbot call).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kriogenx0/magicbox-web:latest

      - name: Configure SSH agent
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 104.131.183.186 >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.DEPLOY_SSH_KEY }}"

      - name: Deploy
        run: deploy/deploy.sh
