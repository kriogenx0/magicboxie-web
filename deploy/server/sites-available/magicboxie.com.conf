# This app's nginx vhost -- copied to /etc/nginx/sites-available/magicboxie.com
# by deploy/deploy.sh (see that script), which also renders __HOST_PORT__
# into the real port before copying. Follows ~/Sites/server-config's
# Conventions for per-app deploy scripts: includes the shared snippets so
# certbot never has to edit this file directly (always --webroot mode).
#
# Requires a cert to already exist at the paths below -- deploy.sh installs
# magicboxie.com.bootstrap.conf (HTTP-only) first on a domain that doesn't
# have one yet, requests the cert, then swaps to this file.
server {
    listen 80;
    listen [::]:80;
    server_name magicboxie.com www.magicboxie.com;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name magicboxie.com www.magicboxie.com;

    ssl_certificate /etc/letsencrypt/live/magicboxie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicboxie.com/privkey.pem;
    include snippets/ssl-params.conf;

    # Movies/music are streamed and can run large -- give uploads and
    # range-request downloads room to breathe instead of nginx's defaults.
    client_max_body_size 0;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:__HOST_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
