# HTTP-only vhost, installed by deploy/deploy.sh only when this domain has
# no TLS cert yet -- magicboxie.com.conf's 443 block would fail `nginx -t`
# (its ssl_certificate points at files that don't exist yet), so nginx
# needs *something* live on port 80 to pass the ACME http-01 challenge
# before certbot can issue that first cert. Once it does, deploy.sh swaps
# this out for the real magicboxie.com.conf and reloads again.
server {
    listen 80;
    listen [::]:80;
    server_name magicboxie.com www.magicboxie.com;

    include snippets/acme-challenge.conf;

    location / {
        return 404;
    }
}
