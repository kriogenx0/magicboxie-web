# Production stack for the magicboxie.com droplet -- just the one magicbox
# container (frontend + Go backend are baked into a single image by the
# repo's own Dockerfile; no separate web/db services, unlike
# docker-compose.yml's local-build equivalent).
#
# Deployed via deploy/deploy.sh, which manages nginx/certbot and this
# file's .env on the host -- see that script and deploy/server_setup.sh.
# ~/Sites/server-config is bootstrapping-only (installs Docker/nginx/
# certbot, creates the deploy account); it doesn't touch this app's
# directory at all. deploy.sh assigns HOST_PORT (in .env) on first run and
# nginx reverse-proxies to it; `docker compose pull` expects the image to
# already be in the registry (GitHub Actions builds + pushes it on every
# push to main), not built on the server.
#
# config/magicbox.yaml must already exist on the server before this comes
# up -- deploy/server_setup.sh creates the directory and drops an example
# there to edit by hand (auth.password_hash + tmdb.api_read_token are
# secrets that can't be generated automatically, and this file is never
# written or overwritten by deploy.sh). Movie/music content and the
# sqlite DB + jwt key live in named Docker volumes, not bind mounts --
# `docker volume rm` if you ever need to reset either.
services:
  magicbox:
    image: ghcr.io/kriogenx0/magicbox-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT}:8080"
    volumes:
      - ./config/magicbox.yaml:/etc/magicbox/config.yaml:ro
      - data:/var/lib/magicbox
      - content:/content

volumes:
  data:
  content:
